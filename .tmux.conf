setw -g mode-keys vi
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

#COLORs
# Enable 256 color mode
set-option -g default-terminal "screen-256color"

# UTF-8 support for special characters
#set-option -g utf8 on
#set-window-option -g utf8 on

# Fix colors inside nested apps (vim, htop, etc.)
set -ga terminal-overrides ",xterm-256color:Tc"


#status bar colors
# Turn on the status bar
set -g status on

# Set background to dark blue (choose one of these)
set -g status-bg colour17      # dark blue (xterm 256 color)
set -g status-fg white         # white text for contrast

# Optional: customize left and right text
set -g status-left " #[fg=brightgreen]#H "
set -g status-right " #[fg=cyan]%H:%M #[fg=yellow]%d-%b-%Y "

#LOGGING PLUGIN
# List of plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'

# Initialize TMUX plugin manager (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
set -g history-limit 50000
